# Experiment configuration. Read once at startup: edit, then restart the app
# (`docker compose restart app`) for changes to take effect.

# Active Condition: the mix of Humans and AI Agents in every new Session.
# Valid values: 3_humans | 2_humans_1_ai | 1_human_2_ai
condition: 2_humans_1_ai

# Phase timings. The server owns every timer.
timings:
  discussion_seconds: 60     # length of each Discussion Phase
  voting_seconds: 20         # max length of each Voting Phase (ends early once everyone has voted)
  inactivity_timeout_minutes: 15  # a Session expires after this long without activity

# Mock mode: AI Agents send scripted messages and vote at random, with no LLM.
# Turn it off to use a real OpenAI-compatible LLM. The endpoint, model and key
# come only from the environment variables LLM_BASE_URL, LLM_MODEL and LLM_API_KEY.
mock_mode: true

# How AI Agents take part (mock mode and real LLM alike).
ai_agents:
  reply_rate: 0.5               # chance of replying to each message from another Participant (0-1)
  message_delay_seconds:        # wait before each message, picked at random in this range
    min: 3
    max: 10
  max_messages_per_phase: 4     # messages per AI Agent per Discussion Phase, opening message included
  vote_delay_seconds:           # wait before voting, picked at random (capped by the Voting Phase)
    min: 1
    max: 4
  tone: casual                  # chat style: short, casual messages like a person typing

# Show which Player Labels were Humans and which were AI Agents on the Result.
# Off by default so future Participants don't learn what AI Agents sound like.
reveal_identities_at_end: false
