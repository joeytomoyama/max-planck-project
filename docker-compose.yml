version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mpp_postgres
    environment:
      - POSTGRES_PASSWORD=secretpgpass
      - POSTGRES_DB=max_planck_project
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mpp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mpp_backend
    environment:
      - DATABASE_URL=postgresql://postgres:secretpgpass@db:5432/max_planck_project
      - DEBUG=${DEBUG:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    container_name: mpp_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  mpp_data:
